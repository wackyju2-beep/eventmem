name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The suite is plain scripts (no pytest).  numpy/onnxruntime are optional: the
      # encoder degrades to FTS and the fakes cover the rest, so don't install them.
      # tests/_host_stub.py supplies the host names the adapter imports.
      #
      # PyYAML is the one real dependency.  Turning config.yaml into CoreSettings is
      # the adapter's whole job (tests/test_hermes_settings.py), and with no parser
      # every override silently falls back to the core defaults.
      - name: install PyYAML
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: run all test scripts
        run: |
          set -e
          for t in tests/test_*.py; do
            echo "== $t"
            python3 "$t"
          done
