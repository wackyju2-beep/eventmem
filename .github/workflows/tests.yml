name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The suite is plain scripts (no pytest) and needs no dependencies: without
      # numpy/onnxruntime the encoder degrades to FTS and the fakes cover the rest.
      # tests/_host_stub.py supplies the three host names the adapter imports.
      - name: run all test scripts
        run: |
          set -e
          for t in tests/test_*.py; do
            echo "== $t"
            python3 "$t"
          done
