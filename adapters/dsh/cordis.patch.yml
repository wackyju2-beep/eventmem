# Mount the eventmem adapter when this package is installed as a DSH profile bundle.
#
# The defaults are single-machine: an eventmem daemon on 127.0.0.1:9123 and no SSH.
# Installing this bundle installs the DSH client only; the daemon (database, recall,
# edge worker) is a separate install — see README.md, or open the plugin's 连接 page.
#
# Remote sharing is opt-in. Set `mode: remote` and `tunnelHost` to a working
# passwordless SSH alias, or leave `mode: local` and point `baseUrl` at an existing
# tunnel. There is deliberately no host name from the author's network here.
- insert:
    - id: eventmem
      name: dsh-eventmem
      config:
        mode: local
        baseUrl: http://127.0.0.1:9123
        agent: dsh
        lang: zh
