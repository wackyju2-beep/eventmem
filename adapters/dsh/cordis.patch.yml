# Mount the eventmem adapter when this package is installed as a DSH profile bundle.
# The daemon stays on the Mint box; this row is a pure HTTP client over the SSH tunnel.
# `tunnel: true` makes the plugin own that tunnel: it starts `ssh -N -L 9123:...` when the
# adapter activates and stops it when the adapter is unloaded (disable/uninstall/reload).
# An already-working tunnel (autossh, a manual ssh -N, a leftover) is adopted, not duplicated.
- insert:
    - id: eventmem
      name: dsh-eventmem
      config:
        baseUrl: http://127.0.0.1:9123
        agent: dsh
        lang: zh
        tunnel: true
        tunnelHost: mint
        tunnelLocalPort: 9123
        tunnelRemotePort: 9123
